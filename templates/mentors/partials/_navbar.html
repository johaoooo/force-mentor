{% load static %}
<header class="navbar">
  <div class="container navbar__inner">
    <a href="{% url 'mentors:home' %}" class="logo-brand" aria-label="Force Mentor">
      <img src="{% static 'img/logo_force_mentor.svg' %}" width="58" height="42" alt="Force Mentor" class="logo-brand__icon logo-brand__icon--navbar">
    </a>

    <button class="navbar__toggle" id="navbarToggle" aria-label="Ouvrir le menu" type="button">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <nav class="navbar__links" id="navbarLinks">
      <a href="{% url 'mentors:list' %}" class="{% if '/mentors/' in request.path %}active{% endif %}">Trouver un mentor</a>
      <a href="{% url 'mentors:home' %}#comment-ca-marche">Comment ça marche</a>
      <a href="{% url 'mentors:home' %}#temoignages">Témoignages</a>
      <a href="{% url 'mentors:home' %}#faq">FAQs</a>
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="{% if '/tableau-de-bord/' in request.path %}active{% endif %}">Tableau de bord</a>
      {% endif %}
    </nav>
    <div class="navbar__actions" id="navbarActions">
      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}" class="btn btn--outline" title="Gérer mon profil">
          <i class="bi bi-person-fill" style="margin-right: 4px;"></i>{{ user.first_name|default:user.username }}
        </a>
        <form method="post" action="{% url 'logout' %}" style="display:inline;margin:0;">
          {% csrf_token %}
          <button type="submit" class="btn btn--primary" style="cursor:pointer;border:none;">Déconnexion</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn--outline">Se connecter</a>
        <a href="{% url 'register' %}" class="btn btn--primary">S'inscrire</a>
      {% endif %}
    </div>
  </div>
</header>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var toggle = document.getElementById('navbarToggle');
    var links = document.getElementById('navbarLinks');
    var actions = document.getElementById('navbarActions');
    if (toggle && links) {
      toggle.addEventListener('click', function() {
        links.classList.toggle('navbar__links--open');
        if (actions) actions.classList.toggle('navbar__actions--open');
      });
    }
  });
</script>
