<header class="navbar">
  <div class="container navbar__inner">
    <a href="{% url 'mentors:home' %}" class="logo" aria-label="Force Mentor">FORCE <span class="logo__m">M</span>ENTOR</a>
    <nav class="navbar__links">
      <a href="{% url 'mentors:home' %}">Accueil</a>
      <a href="{% url 'mentors:list' %}">Mentors</a>
      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">Mon profil</a>
      {% endif %}
    </nav>
    <div class="navbar__actions">
      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}" class="btn btn--outline">{{ user.first_name|default:user.username }}</a>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="btn btn--primary" style="cursor:pointer;border:none;">Déconnexion</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn--outline">Se connecter</a>
        <a href="{% url 'register' %}" class="btn btn--primary">S'inscrire</a>
      {% endif %}
    </div>
  </div>
</header>
