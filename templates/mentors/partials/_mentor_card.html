<article class="mentor">
  <div class="mentor__head">
    {% if mentor.photo %}
      <img class="avatar" src="{{ mentor.photo.url }}" alt="{{ mentor.nom }}">
    {% else %}
      <span class="avatar avatar--initials">{{ mentor.initiales }}</span>
    {% endif %}
    <div>
      <strong>{{ mentor.nom }}</strong>
      <small>{{ mentor.domaine }}</small>
    </div>
  </div>
  <div class="rating">
    <span class="stars" style="--rating: {{ mentor.note|stringformat:'.1f' }}" aria-label="Note {{ mentor.note }} sur 5"></span>
    <span>{{ mentor.note }} ({{ mentor.nb_avis }} avis)</span>
  </div>
  <p>{{ mentor.bio }}</p>
  <div class="mentor__actions" style="margin-top: 14px; display: flex; gap: 8px;">
    {% if mentor.profile %}
      <a href="{% url 'mentor_detail' mentor.profile.id %}" class="btn btn--outline" style="flex: 1; justify-content: center; font-size: 12px; padding: 7px 10px;">Détails</a>
      <a href="{% url 'create_request' mentor.profile.id %}" class="btn btn--green" style="flex: 1; justify-content: center; font-size: 12px; padding: 7px 10px;">Solliciter</a>
    {% else %}
      <a href="{% url 'mentors:list' %}?q={{ mentor.nom }}" class="btn btn--outline" style="width: 100%; justify-content: center; font-size: 12px;">En savoir plus</a>
    {% endif %}
  </div>
</article>
