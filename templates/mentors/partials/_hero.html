<section class="hero">

      <h1>Trouvez le mentor idéal<br>pour progresser</h1>
      <p>Bénéficiez de l'accompagnement de professionnels expérimentés qui vous guideront dans votre parcours, vous aideront à développer vos compétences et à atteindre vos objectifs.</p>

        <input type="text" name="q" placeholder="Rechercher un mentor ou une matière..." value="{{ q|default:'' }}" aria-label="Rechercher">
        <button type="submit" class="btn btn--green">Rechercher
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </form>
    </div>
