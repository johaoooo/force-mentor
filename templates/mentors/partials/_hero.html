{% load static %}
<section class="hero">
  <div class="container hero__inner">
    <div class="hero__text">
      <h1>Trouvez le mentor idéal<br>pour progresser</h1>
      <p>Mettez-vous en relation avec des étudiants de niveau supérieur pour surmonter vos difficultés, et partagez vos compétences dans les matières que vous maîtrisez.</p>
      <form class="search" method="get" action="{% url 'mentors:list' %}">
        <svg class="search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" name="q" placeholder="Rechercher par matière, compétence, domaine..." value="{{ q|default:'' }}" aria-label="Rechercher">
        <button type="submit" class="btn btn--green">Rechercher
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </form>
    </div>
    <div class="hero__art" aria-hidden="true">
      <img src="{% static 'img/hero_illustration.png' %}" alt="Étudiants qui s'entraident vers la réussite" class="hero__img">
    </div>
  </div>
</section>
